# 技巧掌握度追踪
#
# 状态流转：unknown → learned → applied → mastered
#   unknown  = 还没学过这个技巧
#   learned  = 已经学了（看过技巧卡/视频），但还没在真题里用
#   applied  = 在练习中有意识地用过，但仍出错
#   mastered = 连续 3 次该题型不再因这个原因失分
#
# 规则：
#   - 每次做完题分析错因后，由对应 skill 更新本文件
#   - 若某技巧状态是 learned/applied 却仍错 → 说明"知道但做不到"，需要专项练
#   - 若某技巧 unknown 却错了 → 先学技巧卡，再练题（这就是"技巧先行"）

