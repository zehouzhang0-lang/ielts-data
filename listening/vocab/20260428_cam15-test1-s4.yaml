# Section 4 生词 — Cambridge 15 Test 1 (精听 2026-04-28)
# 话题：澳大利亚桉树（gum tree）的生态威胁与丛林火

- word: nectar
  phonetic: /ˈnektə/
  zh: 花蜜
  context: 树的花蜜吸引鸟类和昆虫，是生态系统的关键
  synonyms: [sap, pollen]

- word: disinfectant
  phonetic: /ˌdɪsɪnˈfektənt/
  zh: 消毒剂；杀菌剂
  context: 树可能具有天然抑菌/消毒功能
  related: [disinfect, infection, antiseptic]

- word: prematurely
  phonetic: /ˌpriːməˈtʃʊəli/
  zh: 过早地
  context: 树叶 prematurely 脱落，树提前失去光合作用能力
  antonym: belatedly

- word: lime
  phonetic: /laɪm/
  zh: 石灰（氧化钙）；也指酸橙（水果）
  context: lime = calcium hydroxide，用于修路，被雨水冲入土壤影响树的微量元素吸收
  note: 同一词两义——石灰 & 酸橙水果，不要混淆

- word: calcium hydroxide
  phonetic: /ˈkælsiəm haɪˈdrɒksaɪd/
  zh: 氢氧化钙（熟石灰，Ca(OH)₂）
  context: Q33答案来源，修路材料污染土壤
  note: lime 的化学正式名称

- phrase: being washed away
  zh: 被冲走；流失
  context: Iron and other micronutrients were being washed away from the soil.
  collocation: wash away — 常见于土壤侵蚀、洪水场景

- phrase: eat their way around them
  zh: 把树干/叶子围着啃一圈
  context: 虫子绕树枝啃食，切断树的输送管道
  pattern: eat one's way through/around sth

- phrase: secrete a solution
  zh: 分泌液体
  context: 生物体主动分泌某种化学物质
  note: secrete /sɪˈkriːt/ ≠ secret /ˈsiːkrɪt/，拼写相近但词性/发音不同

- word: flourish
  phonetic: /ˈflʌrɪʃ/
  zh: 茂盛；蓬勃生长；兴旺
  context: In the absence of fire, certain plants flourish and crowd out others.
  synonyms: [thrive, prosper, bloom]
  ielts_note: thrive 是最高频同义词，阅读听力都常见

- word: proliferate
  phonetic: /prəˈlɪfəreɪt/
  zh: 大量增殖；迅速扩散
  context: Without bushfires, aggressive plant species proliferate.
  synonyms: [multiply, spread, expand rapidly]
  ielts_note: AWL学术词，阅读高频

- word: vegetation
  phonetic: /ˌvedʒɪˈteɪʃən/
  zh: 植被（统称，不可数名词）
  context: tropical vegetation — 热带植被
  note: 不可数，不说 vegetations
  synonyms: [flora, plant life, greenery]
